name: Deploy PWAs to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:stocks
      - run: npm run build
        env:
          PWA_REPO: pwa-apps
          VITE_GITHUB_TOKEN_BOX: ${{ secrets.DATA_GITHUB_TOKEN_BOX }}
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: dist
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
